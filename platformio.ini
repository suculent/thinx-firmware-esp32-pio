; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = ~/.platformio
src_dir=thinx-esp32-example
lib_dir=lib

[env:esp32]
platform = espressif32
framework = arduino
board = esp-wrover-kit
upload_speed = 230400
monitor_speed = 230400
upload_port = /dev/cu.SLAB_USBtoUART
build_flags = -DDEBUG, -DCONFIG_IDF_TARGET_ESP32, -DCONFIG_LWIP_TCP_OVERSIZE_MSS, -DCORE_DEBUG_LEVEL=0, -DTCP_MSS=536, -DCONFIG_LWIP_DHCP_COARSE_TIMER_SECS=1


[env:esp8266]
platform = espressif8266
board = d1_mini_pro
framework = arduino
monitor_speed = 230400
upload_speed = 460800
monitor_port = /dev/tty.usbserial-01DFA14B
upload_port = /dev/tty.usbserial-01DFA14B

build_flags = -DPLATFORMIO_IDE, -DDEBUG, -DDEBUG_ESP_WIFI, -DCORE_DEBUG_LEVEL=0, -DLWIP_OPEN_SRC, -DTCP_MSS=536, -DLWIP_IPV6=0

monitor_filters = esp8266_exception_decoder, log2file